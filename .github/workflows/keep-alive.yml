name: Keep Supabase Active

on:
  schedule:
    # 4x/dia. Criterio oficial do auto-pause NAO e "qualquer atividade reseta
    # o contador" — e "sufficient user database activity... a few user
    # requests to the database EACH DAY over the previous week"
    # (docs/guides/platform/free-project-pausing). Ping a cada 3 dias falhou
    # no NutriTrack: runs verdes 28/06 e 01/07 e pausou 04/07/2026.
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Pings REST/PostgREST (atividade que CONTA p/ o auto-pause)
        # GET /rest/v1/<tabela> com service_role retorna 200 com dados reais.
        # E trafego de DADOS no projeto (data plane), o unico que reseta o
        # timer de auto-pause. /auth/v1/health e o Management API NAO contam.
        run: |
          set -e
          # 3 queries por run x 4 runs/dia = ~12 queries/dia ("a few each day")
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
              "https://aoyaftmgpaxbbmdihkxn.supabase.co/rest/v1/categories?select=id&limit=$i")
            echo "MyFinances REST ping $i/3: HTTP $CODE"
            [ "$CODE" = "200" ] || (echo "ERRO: data plane nao respondeu 200" && exit 1)
            sleep 2
          done

      - name: Executar SQL real no Postgres (camada extra)
        run: |
          set -e
          RES=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT 1 as alive, now() as ts"}' \
            "https://api.supabase.com/v1/projects/aoyaftmgpaxbbmdihkxn/database/query")
          CODE=$(echo "$RES" | tail -1)
          BODY=$(echo "$RES" | sed '$d')
          echo "MyFinances SQL ping: HTTP $CODE | $BODY"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || (echo "ERRO" && exit 1)
