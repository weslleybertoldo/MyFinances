name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0, 1.1)'
        required: true
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update version
        run: |
          VERSION=${{ github.event.inputs.version }}
          VERSION_CODE=$(echo $VERSION | tr -d '.' | sed 's/^0*//')
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=${{ github.event.inputs.version }}
          mv android/app/build/outputs/apk/debug/app-debug.apk MyFinances-v${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: MyFinances v${{ github.event.inputs.version }}
          files: MyFinances-v${{ github.event.inputs.version }}.apk
          generate_release_notes: true
